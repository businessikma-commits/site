<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ilénia & Maïk — Souvenirs du mariage</title>
  <meta name="description" content="Partagez vos photos et vidéos du mariage d'Ilénia & Maïk." />
  <style>
    :root {
      --sage: #A8B8A0;
      --sage-dark: #5F7058;
      --sage-soft: #EEF3EA;
      --white: #FFFFFF;
      --offwhite: #FAFAF7;
      --ink: #31402E;
      --muted: #626C5D;
      --line: rgba(95, 112, 88, .14);
      --shadow: 0 24px 70px rgba(95, 112, 88, .16);
      --success: #4F7E5F;
      --error: #9C3F3F;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% -18%, rgba(168,184,160,.52), transparent 36%),
        linear-gradient(180deg, var(--offwhite) 0%, var(--sage-soft) 100%);
    }

    .app {
      width: 100%;
      min-height: 100svh;
      padding: max(18px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
    }

    .phone {
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 34px;
      padding: 28px 24px 26px;
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(255,255,255,.9);
      box-shadow: var(--shadow);
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 999px;
      background: rgba(168,184,160,.36);
      right: -78px;
      top: -72px;
      filter: blur(1px);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 27px;
      border: 1px solid rgba(95,112,88,.10);
      pointer-events: none;
    }

    .topline {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--sage-dark);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .18em;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--sage);
      box-shadow: 0 0 0 8px rgba(168,184,160,.18);
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 36px 0 0;
      font-size: clamp(62px, 17vw, 82px);
      line-height: .86;
      letter-spacing: -.078em;
      font-weight: 860;
      color: var(--sage-dark);
    }

    .date {
      position: relative;
      z-index: 1;
      margin-top: 18px;
      font-size: 18px;
      letter-spacing: -.03em;
      color: var(--muted);
      font-weight: 520;
    }

    .caption {
      position: relative;
      z-index: 1;
      margin: 26px 0 0;
      max-width: 310px;
      font-size: 17px;
      line-height: 1.38;
      letter-spacing: -.025em;
      color: var(--ink);
    }

    .card {
      border-radius: 34px;
      padding: 18px;
      background: rgba(255,255,255,.86);
      border: 1px solid rgba(255,255,255,.92);
      box-shadow: 0 18px 52px rgba(95,112,88,.12);
    }

    .upload-head { padding: 6px 6px 14px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--sage-soft);
      color: var(--sage-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .02em;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0;
      font-size: 30px;
      line-height: .98;
      letter-spacing: -.055em;
      font-weight: 850;
      color: var(--sage-dark);
    }

    .hint {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.42;
      letter-spacing: -.015em;
    }

    .dropzone {
      display: grid;
      place-items: center;
      min-height: 186px;
      padding: 24px 18px;
      border-radius: 28px;
      border: 1.5px dashed rgba(114,128,107,.52);
      background: linear-gradient(180deg, #fff 0%, #F6F9F3 100%);
      text-align: center;
      cursor: pointer;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }

    .dropzone:active { transform: scale(.985); }
    .dropzone.dragover { border-color: var(--sage-dark); background: var(--sage-soft); }

    .plus {
      width: 66px;
      height: 66px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
      color: var(--white);
      background: var(--sage-dark);
      font-size: 38px;
      font-weight: 300;
      box-shadow: 0 16px 30px rgba(95,112,88,.24);
    }

    .dropzone strong {
      display: block;
      font-size: 20px;
      letter-spacing: -.035em;
      margin-bottom: 6px;
    }

    .dropzone span {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    input[type="file"] { display: none; }

    .file-list {
      margin-top: 12px;
      display: grid;
      gap: 8px;
      max-height: 190px;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 13px;
      border-radius: 18px;
      background: var(--offwhite);
      border: 1px solid var(--line);
      animation: pop .16s ease-out;
    }

    @keyframes pop { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .file-name {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 14px;
      font-weight: 700;
    }

    .file-size {
      flex: none;
      font-size: 12px;
      color: var(--sage-dark);
      font-weight: 700;
    }

    .button {
      width: 100%;
      margin-top: 14px;
      min-height: 58px;
      border: 0;
      border-radius: 999px;
      background: var(--sage-dark);
      color: var(--white);
      font-size: 17px;
      font-weight: 850;
      letter-spacing: -.02em;
      cursor: pointer;
      box-shadow: 0 16px 28px rgba(95,112,88,.20);
      transition: transform .2s ease, opacity .2s ease;
    }

    .button:active { transform: scale(.985); }
    .button:disabled { opacity: .36; box-shadow: none; cursor: not-allowed; }

    .progress-wrap {
      display: none;
      margin-top: 14px;
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(95,112,88,.12);
    }

    .progress {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--sage-dark), var(--sage));
      transition: width .25s ease;
    }

    .message {
      min-height: 38px;
      margin: 14px 4px 2px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    .message.success { color: var(--success); font-weight: 800; }
    .message.error { color: var(--error); font-weight: 800; }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 4px 0 0;
    }

    @media (min-width: 760px) {
      .app { align-items: center; padding: 32px; }
      .phone { max-width: 460px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="phone">
      <section class="hero">
        <div>
          <div class="topline"><span>Mariage</span><span class="dot"></span></div>
          <h1>Ilénia<br>& Maïk</h1>
          <div class="date">27 juin 2026</div>
        </div>
        <p class="caption">Partagez vos plus beaux souvenirs, directement depuis votre téléphone.</p>
      </section>

      <section class="card">
        <div class="upload-head">
          <div class="badge">Espace privé</div>
          <h2>Photos & vidéos</h2>
          <p class="hint">Choisissez plusieurs fichiers. Laissez la page ouverte pendant l’envoi.</p>
        </div>

        <label class="dropzone" id="dropzone">
          <input id="fileInput" type="file" multiple accept="image/*,video/*,.heic,.HEIC,.mov,.MOV" />
          <div>
            <div class="plus">+</div>
            <strong>Ajouter mes souvenirs</strong>
            <span>JPG, PNG, HEIC, MP4, MOV</span>
          </div>
        </label>

        <div class="file-list" id="fileList"></div>
        <button class="button" id="uploadButton" disabled>Envoyer</button>
        <div class="progress-wrap" id="progressWrap"><div class="progress" id="progress"></div></div>
        <div class="message" id="message">Aucun compte nécessaire.</div>
      </section>

      <div class="footer">Avec amour — Ilénia & Maïk</div>
    </div>
  </main>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropzone = document.getElementById('dropzone');
    const fileList = document.getElementById('fileList');
    const uploadButton = document.getElementById('uploadButton');
    const progressWrap = document.getElementById('progressWrap');
    const progress = document.getElementById('progress');
    const message = document.getElementById('message');
    let selectedFiles = [];

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function renderFiles() {
      fileList.innerHTML = '';
      selectedFiles.forEach(file => {
        const item = document.createElement('div');
        item.className = 'file-item';
        item.innerHTML = `<div class="file-name">${file.name}</div><div class="file-size">${formatBytes(file.size)}</div>`;
        fileList.appendChild(item);
      });
      uploadButton.disabled = selectedFiles.length === 0;
      message.className = 'message';
      message.textContent = selectedFiles.length ? `${selectedFiles.length} fichier(s) prêt(s) à envoyer.` : 'Aucun compte nécessaire.';
    }

    function setFiles(files) {
      selectedFiles = Array.from(files).filter(file => file.type.startsWith('image/') || file.type.startsWith('video/') || /\.(heic|mov)$/i.test(file.name));
      renderFiles();
    }

    fileInput.addEventListener('change', event => setFiles(event.target.files));
    dropzone.addEventListener('dragover', event => { event.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', event => {
      event.preventDefault();
      dropzone.classList.remove('dragover');
      setFiles(event.dataTransfer.files);
    });

    async function uploadOneFile(file, index, total) {
      const sessionResponse = await fetch('/api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: file.name,
          mimeType: file.type || 'application/octet-stream'
        })
      });

      if (!sessionResponse.ok) {
        throw new Error(await sessionResponse.text());
      }

      const { uploadUrl } = await sessionResponse.json();

      await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', uploadUrl, true);
        xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');

        xhr.upload.onprogress = (event) => {
          if (!event.lengthComputable) return;
          const fileProgress = event.loaded / event.total;
          const totalProgress = ((index + fileProgress) / total) * 100;
          progress.style.width = `${Math.round(totalProgress)}%`;
        };

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            progress.style.width = `${Math.round(((index + 1) / total) * 100)}%`;
            resolve();
          } else {
            reject(new Error(xhr.responseText || `Erreur upload ${file.name}`));
          }
        };

        xhr.onerror = () => reject(new Error(`Erreur réseau pendant l’envoi de ${file.name}`));
        xhr.send(file);
      });
    }

    uploadButton.addEventListener('click', async () => {
      if (!selectedFiles.length) return;
      uploadButton.disabled = true;
      progressWrap.style.display = 'block';
      progress.style.width = '0%';
      message.className = 'message';
      message.textContent = 'Envoi en cours… gardez cette page ouverte.';

      try {
        for (let i = 0; i < selectedFiles.length; i++) {
          message.textContent = `Envoi ${i + 1}/${selectedFiles.length}`;
          await uploadOneFile(selectedFiles[i], i, selectedFiles.length);
        }
        selectedFiles = [];
        fileInput.value = '';
        renderFiles();
        progress.style.width = '100%';
        message.className = 'message success';
        message.textContent = 'Merci ! Vos souvenirs ont bien été envoyés.';
      } catch (error) {
        message.className = 'message error';
        message.textContent = 'Erreur : ' + error.message;
      } finally {
        uploadButton.disabled = selectedFiles.length === 0;
      }
    });
  </script>
</body>
</html>
